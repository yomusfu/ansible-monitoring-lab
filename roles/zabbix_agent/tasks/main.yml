---
- name: Скачать пакет репозитория Zabbix 7.0
  get_url:
    url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
    dest: /tmp/zabbix-release.deb
    mode: '0644'

- name: Установить репозиторий Zabbix
  apt:
    deb: /tmp/zabbix-release.deb

- name: Обновить кэш пакетов
  apt:
    update_cache: true

- name: Установить Zabbix Agent 2
  apt:
    name: zabbix-agent2
    state: present

- name: Деплой конфига агента
  template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
  notify: Restart zabbix-agent2

- name: Запустить и включить агент
  systemd:
    name: zabbix-agent2
    state: started
    enabled: true
